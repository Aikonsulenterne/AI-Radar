# Lokal udvikling: web + api i containere.
# Supabase køres separat via `supabase start` (lokal) eller staging-projektet.
services:
  api:
    build:
      context: ../apps/api
    ports:
      - "8000:8000"
    environment:
      # Secrets leveres via .env / miljø — aldrig committet.
      - ENVIRONMENT=local

  web:
    build:
      context: ../apps/web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - api
