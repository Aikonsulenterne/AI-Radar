# Render Blueprint — staging-API på free tier.
# Bruges via Render Dashboard → New → Blueprint → vælg dette repo.
#
# Free tier-begrænsninger (accepteret for staging, se docs/04_Deployment.md):
# - Servicen sover efter inaktivitet; første kald tager ~30-50 sek.
# - Ingen separat worker-proces: kørsler udløses via POST /api/v1/runs —
#   ugentligt fra GitHub Actions (.github/workflows/weekly-run.yml) og on
#   demand med "Kør nu" i admin — og udføres i API-processen.
#
# Secrets (sync: false) indtastes i Render-dashboardet — aldrig i Git.
services:
  - type: web
    name: ai-radar-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /api/v1/health
    autoDeploy: true
    # Ingen dockerCommand: imagets CMD binder selv uvicorn til $PORT, som
    # Render sætter. En dockerCommand med egen `sh -c "..."` bliver kørt
    # gennem Renders shell igen og ender som ét kommando-ord (exit 127).
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_STORAGE_BUCKET
        value: documents
      - key: SUPABASE_URL
        value: https://vzopuffhiwrhpdibgaaw.supabase.co
      # Vercel-domænet sættes i dashboardet. sync: false, så en blueprint-sync
      # ved push aldrig nulstiller det til en fast værdi og bryder frontenden.
      - key: CORS_ORIGINS
        sync: false
      # JWT-validering sker via projektets JWKS (SUPABASE_URL) — ingen
      # SUPABASE_JWT_SECRET nødvendig med moderne signing keys.
      # Claude via Anthropics SDK. Model og nøgle sættes i dashboardet: modellen
      # er et pris-/kvalitetsvalg, og nøglen ligger aldrig i Git.
      - key: AI_PROVIDER
        value: anthropic
      - key: AI_MODEL_ID
        sync: false
      - key: AI_PROVIDER_API_KEY
        sync: false
      # Delt hemmelighed til den ugentlige udløser (GitHub Actions). Samme værdi
      # sættes som repository secret WORKER_TRIGGER_TOKEN.
      - key: WORKER_TRIGGER_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
